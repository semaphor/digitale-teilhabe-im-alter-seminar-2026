name: Deploy Quartz Wiki to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Quartz can read per-page created/modified dates from git

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npx quartz build

      - name: Build reveal.js slide decks
        working-directory: content/Präsentationen
        run: |
          npm ci
          # Every subfolder whose .md matches its own folder name is a slide
          # deck (Obsidian folder-note convention) - build it generically so
          # renaming/adding/removing a talk in Obsidian never breaks this step.
          for dir in */; do
            name="${dir%/}"
            [ "$name" = "shared" ] && continue
            md="$dir$name.md"
            [ -f "$md" ] || continue
            # match Quartz's own sluggify() so the deck lands at the same
            # URL a normal content page with this folder name would get
            slug=$(printf '%s' "$name" | sed -e 's/ /-/g' -e 's/&/-and-/g' -e 's/%/-percent/g' -e 's/?//g' -e 's/#//g')
            npx reveal-md "$md" --css shared/theme.css --template shared/template.html --static "_site/$slug"
            # reveal-md resolves image paths relative to each deck's own
            # folder, not the invocation cwd, so the shared logos/QR code
            # never get copied by the build itself - copy them in manually.
            cp shared/logos/*.png shared/qr-code.svg "_site/$slug/"
            # two PDF exports (with/without speaker notes) via reveal.js's
            # own print-pdf mode - reveal-md's --print CLI option can't add
            # showNotes, so this drives Puppeteer directly instead
            node print-pdf.mjs "$slug"
          done

      - name: Publish slide decks into the site
        run: cp -r content/Präsentationen/_site/* public/Präsentationen/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
