name: Deploy Quartz Wiki to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Quartz can read per-page created/modified dates from git

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npx quartz build

      - name: Build reveal.js slide decks
        working-directory: content/vortraege
        run: |
          npm ci
          npm run build
          # reveal-md resolves image paths relative to each deck's own folder,
          # not the invocation cwd, so the shared logos/QR code never get
          # copied by the build itself - copy them in manually per deck.
          for deck in _site/*/; do
            mkdir -p "$deck/shared"
            cp -r shared/* "$deck/shared/"
          done

      - name: Publish slide decks into the site
        run: cp -r content/vortraege/_site/* public/vortraege/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
