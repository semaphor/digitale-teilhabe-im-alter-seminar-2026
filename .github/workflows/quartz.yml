name: Deploy Quartz Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'vortraege/_site/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Quartz from GitHub
        run: |
          curl -L https://github.com/QuartzWiki/quartz/archive/refs/heads/main.zip -o quartz.zip
          unzip quartz.zip
          mv quartz-main quartz

      - name: Install dependencies
        run: |
          cd quartz
          npm install
          cd ..

      - name: Build Quartz site
        run: |
          cd quartz
          npx quartz build --output-dir ../_quartz

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
